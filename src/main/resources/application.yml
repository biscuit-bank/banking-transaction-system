spring:
  application:
    name: banking-transaction-system

  datasource:
    url: jdbc:sqlite:data/bank.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=ON&transaction_mode=IMMEDIATE
    driver-class-name: org.sqlite.JDBC
    hikari:
      pool-name: BTS-SQLite-WAL-Pool
      maximum-pool-size: 1
      minimum-idle: 1
      connection-timeout: 10000
      connection-init-sql: PRAGMA journal_mode=WAL; PRAGMA busy_timeout=5000; PRAGMA synchronous=NORMAL; PRAGMA foreign_keys=ON;

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  thymeleaf:
    cache: false
    encoding: UTF-8

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 15m
      cookie:
        name: BTS_SESSION
        http-only: true
        same-site: lax

# Swagger UI disabled by default outside dev profile (SEC-08)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Externalized Banking Business Rules (BR-01 to BR-29)
bank:
  currency: EGP
  max-active-accounts: 5
  lockout:
    max-failed-attempts: 5
    duration-minutes: 15
  limits:
    min-deposit-egp: 10.00
    max-deposit-egp: 100000.00
    max-single-txn-egp: 70000.00
    max-daily-debit-egp: 120000.00
    max-monthly-debit-egp: 400000.00
  fee:
    inter-customer-rate: 0.001
    min-fee-egp: 0.50
    max-fee-egp: 20.00
  savings:
    min-balance-egp: 1000.00
    annual-interest-rate: 0.1700
  checking:
    min-opening-egp: 0.00
    max-opening-egp: 100000.00
    overdraft-limit-egp: -1000.00
  fixed-deposit:
    min-opening-egp: 5000.00
    rate-12-months: 0.1700
    rate-36-months: 0.1775
  admin:
    email: ${BANK_ADMIN_EMAIL:admin@biscuitbank.eg}
    password: ${BANK_ADMIN_PASSWORD:}
  jobs:
    zone: Africa/Cairo
    # JOB-01: first day of every calendar month at 00:00 Cairo time
    savings-interest-cron: "0 0 0 1 * *"
    # JOB-02: daily at 00:05 Cairo time, so maturity is credited on its date
    fixed-deposit-maturity-cron: "0 5 0 * * *"

---
# DEV Profile Configuration (Enables Swagger UI & Deterministic Demo Credentials)
spring:
  config:
    activate:
      on-profile: dev

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html